[project]
name = "gridkeep-worker"
version = "0.1.0"
description = "GRIDKEEP Celery worker - runs the same domain services as the API"
requires-python = ">=3.12"
dependencies = [
    "gridkeep-api",
    "celery>=5.4.0",
    "redis>=5.0.8",
]

[tool.uv.sources]
gridkeep-api = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]
