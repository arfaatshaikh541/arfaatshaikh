[project]
name = "gridkeep-worker"
version = "0.1.0"
description = "GRIDKEEP Celery worker - runs the same domain services as the API"
requires-python = ">=3.12"
dependencies = [
    "gridkeep-api",
    "gridkeep-connector-sdk",
    "celery>=5.4.0",
    "redis>=5.0.8",
]

[tool.uv.sources]
gridkeep-api = { workspace = true }
gridkeep-connector-sdk = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.9",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
