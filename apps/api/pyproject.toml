[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridkeep-api"
version = "0.1.0"
description = "GRIDKEEP Cyber OS — FastAPI backend (modular monolith)"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "sqlalchemy[asyncio]==2.0.36",
  "asyncpg==0.30.0",
  "alembic==1.14.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.1",
  "argon2-cffi==23.1.0",
  "cryptography==49.0.0",
  "redis==5.2.1",
  "celery==5.4.0",
  "python-multipart==0.0.32",
  "itsdangerous==2.2.0",
  "email-validator==2.2.0",
  "structlog==24.4.0",
  "pyotp==2.10.0",
  "dnspython==2.8.0",
  # Not on an index — installed separately via
  # `pip install -e ../../packages/connector-sdk` (see README) before this
  # package. Declared here so the dependency is documented, not resolved
  # by this line alone.
  "gridkeep-connector-sdk",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "pytest-asyncio==1.4.0",
  "httpx==0.28.1",
  "ruff==0.8.4",
  "mypy==1.14.0",
  "psycopg[binary]==3.2.3",
  "setuptools>=83.0.0",
  "pip-audit==2.10.1",
  "aiosmtpd==1.4.6",
]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["core*", "db*", "modules*", "seed*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "B008",  # FastAPI's Depends()/Cookie()/Header() as default args is the documented pattern
]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]  # autogenerated, not hand-wrapped
"tests/*.py" = ["B017"]  # pytest.raises(Exception) is fine for asserting "encryption/DB rejects this"
