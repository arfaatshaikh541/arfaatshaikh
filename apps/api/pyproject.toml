[project]
name = "gridkeep-api"
version = "0.1.0"
description = "GRIDKEEP Lead Intelligence backend API (FastAPI modular monolith)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.2",
    "argon2-cffi>=23.1.0",
    "redis>=5.0.8",
    "celery>=5.4.0",
    "boto3>=1.35.0",
    "python-multipart>=0.0.12",
    "email-validator>=2.2.0",
    "structlog>=24.4.0",
    "cryptography>=43.0.0",
    "aiosmtplib>=3.0.2",
    "openpyxl>=3.1.5",
    "gridkeep-connector-sdk",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.9",
    "mypy>=1.11.0",
    "aiosmtpd>=1.4.6",
    "moto[s3,server]>=5.0.0",
]

[tool.uv.sources]
gridkeep-connector-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
