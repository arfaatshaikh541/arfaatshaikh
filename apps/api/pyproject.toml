[project]
name = "world-of-islam-api"
version = "0.1.0"
description = "Secure platform API foundation for World of Islam"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "pydantic-settings==2.10.1",
  "sqlalchemy[asyncio]==2.0.43",
  "asyncpg==0.30.0",
  "alembic==1.16.5",
  "redis==5.2.1",
  "boto3==1.40.20",
  "structlog==25.4.0",
  "celery[redis]==5.5.3",
  "argon2-cffi==25.1.0",
  "email-validator==2.2.0",
  "httpx==0.28.1"
]

[dependency-groups]
dev = [
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.11"
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
