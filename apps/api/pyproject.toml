[project]
name = "cops-api"
version = "0.1.0"
description = "Client Operations Platform — FastAPI backend (modular monolith)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.1,<4.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "argon2-cffi>=23.1,<24.0",
    "redis>=5.0,<6.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.1",
    "boto3>=1.34",
    "celery>=5.4,<6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]

[tool.ruff]
line-length = 165
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    # StrEnum would change how SQLAlchemy's Enum(native_enum=False)
    # serialises our enum columns — not worth the risk for a cosmetic rule.
    "UP042",
    # `param: T = Depends(require_permission("x.y"))` is FastAPI's own
    # dependency-injection idiom, used throughout this codebase for
    # auth/tenant/entitlement dependencies — not a mutable-default bug.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Test files legitimately have longer setup lines (factory calls with
# several named arguments); wrapping every one hurts readability more
# than it helps.
"app/tests/**/*.py" = ["E501"]
# Alembic autogenerates these — never hand-edit their formatting.
"app/alembic/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
