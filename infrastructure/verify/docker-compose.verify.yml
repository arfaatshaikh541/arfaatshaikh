# Production-like stack for VERIFICATION on a machine that cannot pull every production image.
#
# It runs the real production artifacts: the API image (apps/api/Dockerfile), the web image (apps/web/Dockerfile, built with the
# /worldofislam base path), nginx with the production template, PostgreSQL 17 and Redis. It deliberately omits MinIO, Ollama,
# the Celery worker and the backup job (their images could not be pulled in the build environment, and none of them serves
# public pages). See infrastructure/verify/README.md. Build the two images first (the script does):
#   infrastructure/verify/run.sh
name: woi-verify

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      WOI_APP_DB_USER: ${WOI_APP_DB_USER}
      WOI_APP_DB_PASSWORD: ${WOI_APP_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/10-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    networks: [backend]

  redis:
    image: mirror.gcr.io/library/redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [backend]

  migrate:
    image: woi-api:verify
    env_file: ${WOI_ENV_FILE}
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [backend]

  api:
    image: woi-api:verify
    env_file: ${WOI_ENV_FILE}
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=4)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 15s
    networks: [backend, edge]

  web:
    image: woi-web:verify
    environment:
      WOI_BASE_PATH: ${WOI_BASE_PATH}
      WOI_API_ORIGIN: http://api:8000
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000${WOI_BASE_PATH}/robots.txt"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 15s
    networks: [edge]

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      web: {condition: service_healthy}
      api: {condition: service_healthy}
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ../nginx/woi.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${WOI_CERT_DIR}:/etc/letsencrypt/live/${WOI_PUBLIC_HOST}:ro
    environment:
      WOI_PUBLIC_HOST: ${WOI_PUBLIC_HOST}
      WOI_BASE_PATH: ${WOI_BASE_PATH}
    networks:
      edge:
        ipv4_address: 172.31.200.10
      backend:

networks:
  backend:
    internal: true
    driver: bridge
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.200.0/24

volumes:
  pgdata:
