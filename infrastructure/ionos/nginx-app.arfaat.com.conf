# Reverse proxy for https://app.arfaat.com/worldofislam
#
# Assumes the native (non-Docker) deployment from docs/deployment/ionos-vps.md:
#   - apps/api running on 127.0.0.1:8000 (uvicorn/systemd unit woi-api.service)
#   - apps/web running on 127.0.0.1:3000 (node server.js/systemd unit woi-web.service)
#
# Install: copy to /etc/nginx/sites-available/app.arfaat.com, then
#   ln -s /etc/nginx/sites-available/app.arfaat.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# Get a certificate first (see docs/deployment/ionos-vps.md step 6), or
# comment out the ssl_certificate lines and the 443 server block to test on
# plain HTTP before you have one.

server {
    listen 80;
    server_name app.arfaat.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name app.arfaat.com;

    ssl_certificate     /etc/letsencrypt/live/app.arfaat.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.arfaat.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Exact-path health probes for external uptime monitoring.
    location = /worldofislam/api/health/live {
        proxy_pass http://127.0.0.1:8000/health/live;
    }
    location = /worldofislam/api/health/ready {
        proxy_pass http://127.0.0.1:8000/health/ready;
    }

    # API: strip "/worldofislam", forward "/api/v1/..." unchanged.
    location /worldofislam/api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    # Web app: forward the full path, including "/worldofislam" - Next.js's
    # own basePath expects to see it.
    location /worldofislam/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # If arfaat.com/worldofislam (the separate marketing page, not this repo)
    # is not being served from this same host, remove this block.
    location / {
        return 404;
    }
}
