apiVersion: v1
kind: Service
metadata:
  name: {{ include "policy-engine.fullname" . }}
  labels:
    {{- include "policy-engine.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "policy-engine.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
