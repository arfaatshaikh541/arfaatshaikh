apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "control-api.fullname" . }}
  labels:
    {{- include "control-api.labels" . | nindent 4 }}
# No automountServiceAccountToken -- control-api never talks to the
# Kubernetes API itself (internal/platform/clusteradapter is the only thing
# that ever would, and it is mocked -- see docs/security/kubernetes-security-audit.md),
# so this pod has no legitimate use for its own ServiceAccount token.
automountServiceAccountToken: false
