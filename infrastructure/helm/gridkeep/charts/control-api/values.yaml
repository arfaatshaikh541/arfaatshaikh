replicaCount: 2

image:
  repository: gridkeep-control-api
  tag: ""
  pullPolicy: IfNotPresent

# Name of a pre-existing Kubernetes Secret (never created by this chart)
# holding every environment variable config.go treats as required-with-
# no-fallback: DATABASE_URL, REDIS_URL, MFA_ENCRYPTION_KEY,
# PKI_CA_ENCRYPTION_KEY, SECRETS_VAULT_ENCRYPTION_KEY, S3_ACCESS_KEY,
# S3_SECRET_KEY. Provisioning this Secret is a deployment-time concern
# (Vault, External Secrets Operator, sealed-secrets, or a manually created
# Secret for a small deployment) -- deliberately out of this chart's scope,
# the same "no secret ever has a hardcoded default" rule config.go's own
# package doc states for the application itself.
existingSecret: gridkeep-control-api-secrets

service:
  port: 8080
  metricsPort: 9090

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# CONTROL_API_ENV and non-secret tuning knobs -- everything here is safe to
# see in a `helm template` diff or a values.yaml in version control; nothing
# security-sensitive belongs in this map (see existingSecret above).
env:
  CONTROL_API_ENV: production
  SESSION_COOKIE_SECURE: "true"

# Set to a fixed value here only if policy-engine is deployed independently
# of this umbrella chart (a different release name/namespace) -- left empty
# by default, since deployment.yaml computes the in-cluster DNS name from
# .Release.Name directly, assuming both charts are released together (the
# umbrella chart's default).
policyEngineURLOverride: ""

# known limitation (see docs/testing/chaos-testing.md): /healthz is a
# liveness-only check today, it does not verify Postgres/Redis
# connectivity. Using it for both probes here is a deliberate, documented
# stopgap -- replace readinessProbe's path with /readyz once that endpoint
# exists, so a pod whose database is unreachable stops receiving traffic
# instead of continuing to look "ready."
probes:
  livenessPath: /healthz
  readinessPath: /healthz

# Standalone default (used only when this chart is deployed on its own,
# not through the parent umbrella chart, which supplies its own global.*
# values that override this). Empty means "no registry prefix" -- the
# image reference falls back to a bare repository:tag.
global:
  imageRegistry: ""
