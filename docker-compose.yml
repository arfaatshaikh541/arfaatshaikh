name: gridkeep

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gridkeep
      POSTGRES_PASSWORD: gridkeep
      POSTGRES_DB: gridkeep
    ports:
      - "5432:5432"
    volumes:
      - gridkeep_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridkeep -d gridkeep"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  object-storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gridkeep
      MINIO_ROOT_PASSWORD: gridkeep-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - gridkeep_object_storage:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  mail-capture:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      # Milestone 31 (finding C-01): the app's own runtime connection is the
      # least-privilege gridkeep_app role (NOSUPERUSER NOBYPASSRLS), created
      # by migration 34016597f04f — never the superuser DATABASE_MIGRATION_URL
      # below uses. GRIDKEEP_APP_DB_PASSWORD is what that migration reads
      # when creating/updating the role; it must match the password embedded
      # in DATABASE_URL below, or the app will fail to authenticate after
      # `alembic upgrade head` runs.
      DATABASE_URL: postgresql+asyncpg://gridkeep_app:gridkeep-app-dev-only-insecure-do-not-use-in-production@postgres:5432/gridkeep
      DATABASE_MIGRATION_URL: postgresql+psycopg://gridkeep:gridkeep@postgres:5432/gridkeep
      GRIDKEEP_APP_DB_PASSWORD: gridkeep-app-dev-only-insecure-do-not-use-in-production
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOW_ORIGINS: '["http://localhost:3000"]'
      # Used to build clickable links in emails (verify-email,
      # reset-password, accept-invitation) — must match wherever the
      # browser actually reaches the web service, same value the web
      # service itself uses for NEXT_PUBLIC_API_BASE_URL's counterpart.
      APP_BASE_URL: http://localhost:3000
      OBJECT_STORAGE_ENDPOINT: http://object-storage:9000
      MAIL_CAPTURE_HOST: mail-capture
      MAIL_CAPTURE_PORT: "1025"
      VAULT_LOCAL_MASTER_KEY: dev-only-insecure-master-key-do-not-use-in-production-00000000
      # Milestone 29: cookies are Secure-by-default in every environment now
      # (core/config.py, modules/identity/routes.py) — local dev serves the
      # API over plain http://localhost, where a browser will refuse to
      # ever send a Secure cookie back, breaking every authenticated flow.
      # This explicit opt-out is what keeps the dev stack usable; the app
      # refuses to boot with this set true under ENVIRONMENT=production.
      ALLOW_INSECURE_COOKIES_FOR_LOCAL_DEV: "true"
      # Outside /app deliberately — /app is replaced wholesale by the
      # ./apps/api bind mount below at container start, so anything
      # written under it depends on the host directory's permissions
      # matching the container's UID 1000 user. A dedicated named volume
      # avoids that entirely, same pattern as postgres/redis/minio's data
      # below.
      EVIDENCE_STORAGE_ROOT: /data/evidence-storage
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             python -m seed.bootstrap &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./apps/api:/app
      - gridkeep_evidence_storage:/data/evidence-storage

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # `service_started` (not `service_healthy` — `api` has no healthcheck)
      # only guarantees the api container's process has launched, not that
      # its `alembic upgrade head` step (which creates the gridkeep_app role
      # this service connects as) has actually finished. In practice this
      # doesn't race: nothing enqueues a task until the API is serving
      # requests, which only happens after that same container's migrations
      # complete. Documented rather than engineered around, since a stronger
      # guarantee (a real healthcheck gating on migration completion) is
      # more machinery than a local dev compose file's actual risk justifies.
      api:
        condition: service_started
    environment:
      ENVIRONMENT: development
      # Milestone 31 (finding C-01): same least-privilege gridkeep_app role
      # the api service connects as — see its environment block above for
      # the full explanation. This service doesn't run migrations itself,
      # so it needs no GRIDKEEP_APP_DB_PASSWORD, only a DATABASE_URL whose
      # password already matches what the api service's migration step set.
      DATABASE_URL: postgresql+asyncpg://gridkeep_app:gridkeep-app-dev-only-insecure-do-not-use-in-production@postgres:5432/gridkeep
      DATABASE_MIGRATION_URL: postgresql+psycopg://gridkeep:gridkeep@postgres:5432/gridkeep
      REDIS_URL: redis://redis:6379/0
      VAULT_LOCAL_MASTER_KEY: dev-only-insecure-master-key-do-not-use-in-production-00000000
    volumes:
      - ./apps/api:/app/apps/api
      - ./apps/worker:/app/apps/worker

  beat:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    command: ["celery", "-A", "worker.celery_app", "beat", "--loglevel=info"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      # `beat` only schedules tasks onto Redis — it never itself queries
      # Postgres (the `worker` process that consumes the queue does), so
      # this is set for consistency/parity with the other services rather
      # than because beat's own process needs it.
      DATABASE_URL: postgresql+asyncpg://gridkeep_app:gridkeep-app-dev-only-insecure-do-not-use-in-production@postgres:5432/gridkeep
      DATABASE_MIGRATION_URL: postgresql+psycopg://gridkeep:gridkeep@postgres:5432/gridkeep
      REDIS_URL: redis://redis:6379/0
      VAULT_LOCAL_MASTER_KEY: dev-only-insecure-master-key-do-not-use-in-production-00000000
    volumes:
      - ./apps/api:/app/apps/api
      - ./apps/worker:/app/apps/worker

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      # NEXT_PUBLIC_* values are inlined into the client bundle at build
      # time by Next.js — a runtime `environment:` entry here would be a
      # no-op for anything already shipped to the browser. Must be a
      # build arg so it's baked in before `next build` runs.
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  gridkeep_postgres_data:
  gridkeep_object_storage:
  gridkeep_evidence_storage:
