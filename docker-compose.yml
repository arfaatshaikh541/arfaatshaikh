name: gridkeep

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-gridkeep}
      MIGRATOR_DB_USER: ${MIGRATOR_DB_USER:-gridkeep_migrator}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:-gridkeep_migrator_dev_password}
      APP_DB_USER: ${APP_DB_USER:-gridkeep_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-gridkeep_app_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - gridkeep_postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - gridkeep_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-gridkeep_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-gridkeep_minio_dev_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - gridkeep_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # smtp

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app/apps/api
      - ./apps/worker:/app/apps/worker
      - ./packages:/app/packages

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  gridkeep_postgres_data:
  gridkeep_redis_data:
  gridkeep_minio_data:
