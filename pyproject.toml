[tool.uv.workspace]
members = ["apps/api", "apps/worker", "packages/connector-sdk"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/api/app", "apps/worker/worker", "packages/connector-sdk/connector_sdk"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501: line length is handled by ruff format, not worth double-enforcing.
# B008: FastAPI's `Depends(...)` default-argument pattern is the documented,
# idiomatic way to declare dependencies - not a bug in this codebase.
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
