name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  control-api:
    name: control-api (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gridkeep_test
          POSTGRES_USER: gridkeep
          POSTGRES_PASSWORD: gridkeep_dev_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gridkeep -d gridkeep_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/control-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/control-api/go.sum
      - name: gofmt
        run: |
          diff <(gofmt -l .) <(echo -n "") || (echo "Run gofmt -w ." && exit 1)
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: apps/control-api
          version: latest
      - name: go build
        run: go build ./...
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.25"
          work-dir: apps/control-api
      - name: migration check (fresh apply)
        env:
          DATABASE_URL: postgres://gridkeep:gridkeep_dev_password@localhost:5432/gridkeep_test?sslmode=disable
        run: |
          go run ./cmd/seed --help >/dev/null 2>&1 || true
          go build -o /tmp/seed-check ./cmd/seed
          CONTROL_API_ENV=development DATABASE_URL="$DATABASE_URL" /tmp/seed-check
      - name: go test (unit + integration, sequential packages)
        env:
          TEST_DATABASE_URL: postgres://gridkeep:gridkeep_dev_password@localhost:5432/gridkeep_test?sslmode=disable
        run: go test -p 1 ./... -v

  worker:
    name: worker (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/worker/go.sum
      - name: gofmt
        run: diff <(gofmt -l .) <(echo -n "") || (echo "Run gofmt -w ." && exit 1)
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: apps/worker
          version: latest
      - name: go build
        run: go build ./...
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.24"
          work-dir: apps/worker
      - name: go test
        run: go test ./...

  policy-engine:
    name: policy-engine (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/policy-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy src
      - name: pytest
        run: python -m pytest -q
      - name: pip-audit
        run: |
          python -m pip install --quiet --upgrade pip pip-audit
          pip-audit --skip-editable

  web:
    name: web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install
        run: npm ci
      - name: lint
        run: npx eslint .
      - name: typecheck
        run: npx tsc --noEmit
      - name: test
        run: npx vitest run
      - name: build
        env:
          NEXT_PUBLIC_CONTROL_API_URL: http://localhost:8080
        run: npx next build
      # Non-blocking: as of this milestone, `npm audit` reports 3 high-severity
      # advisories (postgres/sharp, both transitive through next's own bundled
      # dependencies -- see docs/security/application-security-audit.md) whose
      # only fix is a breaking Next.js downgrade. Reported here so a
      # regression is visible in every run, not silently ignored, without
      # blocking merges on an upstream fix this repo doesn't control.
      - name: npm audit (report only)
        continue-on-error: true
        run: npm audit --audit-level=high

  docker-compose-validate:
    name: docker-compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate compose file
        run: docker compose config -q

  # Builds every service's production image, scans it for known
  # vulnerabilities (Trivy) and generates an SBOM (Syft) regardless of
  # branch, so a PR that introduces a new vulnerable dependency is visible
  # before merge. Only a push to main additionally pushes the (cosign
  # keyless-signed, via this job's own GitHub OIDC token -- no long-lived
  # signing key stored anywhere) image to GHCR, since a PR build is never
  # something this pipeline should publish.
  container-security:
    name: container security (build, scan, SBOM, sign)
    needs: [control-api, worker, policy-engine, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: control-api
            context: apps/control-api
            dockerfile: apps/control-api/Dockerfile
          - service: worker
            context: apps/worker
            dockerfile: apps/worker/Dockerfile
          - service: policy-engine
            context: apps/policy-engine
            dockerfile: apps/policy-engine/Dockerfile
          - service: web
            context: .
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: build image (local, untagged for registry push yet)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          tags: gridkeep-${{ matrix.service }}:ci
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: scan image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: gridkeep-${{ matrix.service }}:ci
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "0" # report-only here; see the standalone gate below

      - name: upload Trivy results to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      - name: fail on critical vulnerabilities with a known fix
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: gridkeep-${{ matrix.service }}:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: generate SBOM (Syft, SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: gridkeep-${{ matrix.service }}:ci
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.spdx.json

      - name: upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.spdx.json

      - name: log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          tags: ghcr.io/${{ github.repository_owner }}/gridkeep-${{ matrix.service }}:${{ github.sha }}
          push: true
          cache-from: type=gha,scope=${{ matrix.service }}

      - name: install cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v3

      - name: sign image (keyless, GitHub OIDC identity)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/gridkeep-${{ matrix.service }}@${{ steps.push.outputs.digest }}
