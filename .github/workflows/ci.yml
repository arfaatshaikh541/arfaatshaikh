name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gridkeep
          POSTGRES_PASSWORD: gridkeep
          POSTGRES_DB: gridkeep_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gridkeep -d gridkeep_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: test
      # Milestone 31 (finding C-01): the app's own runtime connection is the
      # least-privilege gridkeep_app role, created by migration 34016597f04f
      # — never the superuser DATABASE_MIGRATION_URL below still uses to run
      # migrations. GRIDKEEP_APP_DB_PASSWORD is what that migration reads
      # when creating the role; it must match the password embedded in
      # DATABASE_URL, same pattern as docker-compose.yml.
      DATABASE_URL: postgresql+asyncpg://gridkeep_app:gridkeep-app-dev-only-insecure-do-not-use-in-production@localhost:5432/gridkeep_test
      DATABASE_MIGRATION_URL: postgresql+psycopg://gridkeep:gridkeep@localhost:5432/gridkeep_test
      GRIDKEEP_APP_DB_PASSWORD: gridkeep-app-dev-only-insecure-do-not-use-in-production
      REDIS_URL: redis://localhost:6379/0
      VAULT_LOCAL_MASTER_KEY: ci-only-master-key-do-not-use-elsewhere-000000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API dependencies
        working-directory: apps/api
        run: pip install -e ".[dev]"
      - name: Ruff lint
        working-directory: apps/api
        run: ruff check .
      - name: Dependency vulnerability scan (pip-audit)
        working-directory: apps/api
        # `-l` audits the local venv; `gridkeep-api`/`gridkeep-connector-sdk` are
        # unpublished local packages and are skipped (not a scan failure) rather
        # than erroring, since --strict would fail the whole job on that alone.
        # The --ignore-vuln entries are starlette CVEs with no fix version inside
        # the range FastAPI 0.115.6 itself allows (<0.42.0) — upgrading past that
        # requires a FastAPI major-version bump, tracked as a known, accepted risk
        # (see docs/project-status.md Milestone 25) rather than silently ignored.
        run: |
          pip-audit -l \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln PYSEC-2026-249 \
            --ignore-vuln PYSEC-2026-1941 \
            --ignore-vuln PYSEC-2026-1942 \
            --ignore-vuln PYSEC-2026-2280 \
            --ignore-vuln PYSEC-2026-2281
      - name: Run migrations
        working-directory: apps/api
        run: alembic upgrade head
      - name: Backend test suite
        working-directory: apps/api
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Dependency vulnerability scan (pnpm audit)
        # --ignore-unfixable excludes CVEs with no fix available inside the
        # current exact-pinned major version (currently: several `next` CVEs
        # whose fix requires the 15.x line) — a known, accepted risk tracked in
        # docs/project-status.md Milestone 25, not silently ignored. Any
        # vulnerability with a fix available within the current pin still fails
        # this step.
        run: pnpm audit --ignore-unfixable
      - name: Lint
        working-directory: apps/web
        run: pnpm exec eslint .
      - name: Typecheck
        working-directory: apps/web
        run: pnpm exec tsc --noEmit
      - name: Component tests
        working-directory: apps/web
        run: pnpm exec vitest run
      - name: Production build
        working-directory: apps/web
        run: pnpm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install detect-secrets
        run: pip install detect-secrets==1.5.0
      - name: Scan for new secrets against the committed baseline
        # .secrets.baseline records every finding that was manually reviewed
        # and confirmed to be a false positive (dev-only fixture credentials,
        # Alembic revision hashes, etc. — see docs/project-status.md
        # Milestone 25). This only fails on secrets NOT already in that
        # baseline, i.e. something genuinely new.
        run: |
          git ls-files | grep -v -E '\.venv/|node_modules/|\.next/|pnpm-lock\.yaml' \
            | xargs detect-secrets-hook --baseline .secrets.baseline

  security-contracts-sync:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API dependencies
        working-directory: apps/api
        run: pip install -e ".[dev]"
      - name: Verify TS/Python security-contracts stay in sync
        working-directory: apps/api
        run: pytest -q tests/test_security_contracts_sync.py
