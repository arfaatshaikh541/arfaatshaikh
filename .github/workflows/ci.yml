name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gridkeep
          POSTGRES_PASSWORD: gridkeep
          POSTGRES_DB: gridkeep_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gridkeep -d gridkeep_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://gridkeep:gridkeep@localhost:5432/gridkeep_test
      DATABASE_MIGRATION_URL: postgresql+psycopg://gridkeep:gridkeep@localhost:5432/gridkeep_test
      REDIS_URL: redis://localhost:6379/0
      VAULT_LOCAL_MASTER_KEY: ci-only-master-key-do-not-use-elsewhere-000000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API dependencies
        working-directory: apps/api
        run: pip install -e ".[dev]"
      - name: Ruff lint
        working-directory: apps/api
        run: ruff check .
      - name: Run migrations
        working-directory: apps/api
        run: alembic upgrade head
      - name: Backend test suite
        working-directory: apps/api
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: apps/web
        run: pnpm exec eslint .
      - name: Typecheck
        working-directory: apps/web
        run: pnpm exec tsc --noEmit
      - name: Component tests
        working-directory: apps/web
        run: pnpm exec vitest run
      - name: Production build
        working-directory: apps/web
        run: pnpm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000

  security-contracts-sync:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API dependencies
        working-directory: apps/api
        run: pip install -e ".[dev]"
      - name: Verify TS/Python security-contracts stay in sync
        working-directory: apps/api
        run: pytest -q tests/test_security_contracts_sync.py
