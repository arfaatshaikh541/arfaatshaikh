name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (lint, typecheck, migrations, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leadflow
          POSTGRES_PASSWORD: leadflow
          POSTGRES_DB: leadflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leadflow" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://leadflow:leadflow@localhost:5432/leadflow_test
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: test
      SECRET_KEY: ci-only-secret-key-not-used-in-production
      FIELD_ENCRYPTION_KEY: ci-only-encryption-key-not-used!
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Type check (mypy)
        run: mypy app
      - name: Run migrations
        run: alembic upgrade head
      - name: Migration round-trip check
        run: alembic downgrade base && alembic upgrade head
      - name: Run tests
        run: pytest -v

  worker:
    name: Worker (import check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API + worker
        run: |
          pip install -e apps/api
          pip install -e apps/worker
      - name: Import worker app and tasks
        run: python -c "from worker.celery_app import celery_app; from worker.tasks import email, health"

  web:
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @leadflow/web lint
      - name: Type check
        run: pnpm --filter @leadflow/web typecheck
      - name: Test
        run: pnpm --filter @leadflow/web test
      - name: Build
        run: pnpm --filter @leadflow/web build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api
