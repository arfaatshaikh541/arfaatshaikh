<!doctype html><html><head><title>Test fixture application form</title></head><body>
<h1>Test Fixture Role</h1>
<form id="f" novalidate>
  <div><label for="fn">First Name *</label><input id="fn" name="first_name" required></div>
  <div><label for="ln">Last Name *</label><input id="ln" name="last_name" required></div>
  <div><label for="em">Email *</label><input id="em" type="email" name="email" required></div>
  <div><label for="ph">Phone</label><input id="ph" type="tel" name="phone"></div>
  <div><label for="cv">Resume/CV *</label><input id="cv" type="file" name="resume" required></div>
  <div><label for="auth">Are you legally authorized to work in the UAE? *</label>
    <select id="auth" name="auth" required><option value="">Select...</option><option>Yes</option><option>No</option></select></div>
  <fieldset><legend>Will you require visa sponsorship? *</legend>
    <label><input type="radio" name="spons" value="y" required> Yes</label>
    <label><input type="radio" name="spons" value="n"> No</label></fieldset>
  <div><label for="yrs">How many years of professional experience do you have? *</label>
    <select id="yrs" name="yrs" required><option value="">Select...</option><option>Less than 1 year</option><option>1-3 years</option><option>3+ years</option></select></div>
  <div><label for="extra">Anything else you would like to share?</label><textarea id="extra" name="extra"></textarea></div>
  <div id="errors" role="alert"></div>
  <button type="submit">Submit application</button>
</form>
<script>
document.getElementById('f').addEventListener('submit', (e) => {
  e.preventDefault();
  const f = e.target; const missing = [];
  for (const el of f.querySelectorAll('[required]')) {
    if (el.type === 'radio') { if (!f.querySelector(`input[name="${el.name}"]:checked`)) missing.push(el.name); }
    else if (el.type === 'file') { if (!el.files.length) missing.push(el.name); }
    else if (!el.value) missing.push(el.name);
  }
  if (missing.length) { document.getElementById('errors').innerText = 'Please complete: ' + missing.join(', '); return; }
  fetch('/submit-log?' + new URLSearchParams({fn: f.first_name.value, auth: f.auth.value, yrs: f.yrs.value,
        file: f.resume.files[0].name})).then(() => { location.href = '/confirmation.html'; });
});
</script></body></html>
