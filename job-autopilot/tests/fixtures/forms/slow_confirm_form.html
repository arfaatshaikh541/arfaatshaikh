<!doctype html><html><body><h1>Fixture Role</h1><p>Fixture Co</p><form id="f" novalidate>
<label for="fn">First Name *</label><input id="fn" name="first_name" required>
<label for="em">Email *</label><input id="em" type="email" name="email" required>
<button type="submit">Submit application</button></form>
<script>
// The submission request reaches the server immediately; the confirmation page appears only after 20 s.
document.getElementById('f').addEventListener('submit', (e) => {
  e.preventDefault();
  fetch('/submit-log?' + new URLSearchParams({form: 'slow', fn: e.target.first_name.value}))
    .then(() => setTimeout(() => { location.href = '/confirmation.html'; }, 20000));
});
</script></body></html>
