[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-autopilot"
version = "0.1.0"
description = "Autonomous, evidence-based job discovery and application system"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "jinja2>=3.1",
  "httpx>=0.27",
  "cryptography>=41",
  "playwright>=1.45",
  "pypdf>=4.2",
  "python-docx>=1.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
autopilot = "autopilot.cli:main"

[tool.setuptools.packages.find]
include = ["autopilot*"]

[tool.setuptools.package-data]
autopilot = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
